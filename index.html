<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Todo List</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    body{
      font-family:Arial, sans-serif;
      background:#050c1a;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
      color:white;
    }

    .todo-container{
      width:100%;
      max-width:450px;
      background:#169b4d;
      padding:25px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      font-size:32px;
    }

    /* INPUT + BUTTON */

    .task-input{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    .task-input input{
      flex:1;
      padding:15px;
      border:none;
      outline:none;
      border-radius:12px;
      font-size:16px;
      background:#374151;
      color:white;
    }

    .task-input input::placeholder{
      color:#cbd5e1;
    }

    .task-input button{
      width:55px;
      border:none;
      border-radius:12px;
      background:#10b981;
      color:white;
      font-size:28px;
      cursor:pointer;
      flex-shrink:0;
      transition:0.3s;
    }

    .task-input button:hover{
      background:#059669;
    }

    /* TASK LIST */

    ul{
      list-style:none;
    }

    li{
      background:#374151;
      padding:15px;
      border-radius:12px;
      margin-bottom:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      word-break:break-word;
      animation:fadeIn 0.3s ease;
    }

    li.completed span{
      text-decoration:line-through;
      opacity:0.6;
    }

    .task-text{
      flex:1;
      cursor:pointer;
    }

    .delete-btn{
      background:#ef4444;
      border:none;
      color:white;
      width:35px;
      height:35px;
      border-radius:8px;
      cursor:pointer;
      font-size:18px;
      margin-left:10px;
      flex-shrink:0;
    }

    .delete-btn:hover{
      background:#dc2626;
    }

    /* TASK COUNT */

    .task-count{
      margin-top:15px;
      text-align:center;
      color:#d1d5db;
      font-size:15px;
    }

    /* ANIMATION */

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* MOBILE */

    @media(max-width:500px){

      h1{
        font-size:26px;
      }

      .todo-container{
        padding:20px;
      }

      .task-input input{
        padding:13px;
        font-size:15px;
      }

      .task-input button{
        width:50px;
        font-size:24px;
      }

      li{
        padding:13px;
      }
    }

  </style>
</head>

<body>

  <div class="todo-container">

    <h1>Todo List</h1>

    <!-- INPUT -->

    <div class="task-input">

      <input
        type="text"
        id="taskInput"
        placeholder="Ajouter une tâche..."
      >

      <button id="addBtn">+</button>

    </div>

    <!-- TASKS -->

    <ul id="taskList"></ul>

    <!-- COUNT -->

    <div class="task-count">
      Tâches : <span id="taskCount">0</span>
    </div>

  </div>


  <script>

    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    // AFFICHER LES TACHES
    function renderTasks(){

      taskList.innerHTML = "";

      tasks.forEach((task, index)=>{

        const li = document.createElement("li");

        if(task.completed){
          li.classList.add("completed");
        }

        li.innerHTML = `
          <span class="task-text">${task.text}</span>
          <button class="delete-btn">×</button>
        `;

        // TERMINER TACHE
        li.querySelector(".task-text").addEventListener("click", ()=>{

          tasks[index].completed =
          !tasks[index].completed;

          saveTasks();
          renderTasks();
        });

        // SUPPRIMER
        li.querySelector(".delete-btn").addEventListener("click", ()=>{

          tasks.splice(index,1);

          saveTasks();
          renderTasks();
        });

        taskList.appendChild(li);
      });

      taskCount.innerText = tasks.length;
    }

    // AJOUTER TACHE
    function addTask(){

      const text = taskInput.value.trim();

      if(text === "") return;

      tasks.push({
        text:text,
        completed:false
      });

      saveTasks();

      renderTasks();

      taskInput.value = "";
    }

    // SAUVEGARDE LOCALSTORAGE
    function saveTasks(){

      localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
      );
    }

    // BOUTON AJOUT
    addBtn.addEventListener("click", addTask);

    // TOUCHE ENTER
    taskInput.addEventListener("keydown",(e)=>{

      if(e.key === "Enter"){
        addTask();
      }
    });

    // INITIALISATION
    renderTasks();

  </script>

</body>
</html>
