<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="top-bar">
            <h1>To-Do List</h1>
            <button id="themeToggle">🌙</button>
        </div>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Ajoute une tâche...">
            <button id="addBtn">+</button>
        </div>

        <ul id="taskList"></ul>

        <button id="clearAll" class="clear">Tout supprimer</button>

    </div>

    <script src="script.js"></script>
</body>

</html>
